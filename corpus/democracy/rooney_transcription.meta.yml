# Metadata for snapshot://ethicalcapital/2026-11-04/rooney_transcription (praxis/datasets/metadata.schema.yml)
producer: Ethical Capital (this repository)
title: Hand transcription of Rooney Report percents and questionnaire stems, 2026-11-04
description: >-
  Two hand-made inputs to the democracy-proxies build. rooney-transcription.tsv
  holds every percent that appears in the text layer of the 13 pinned Rooney
  Reports (129 rows), each with report, page, wave as stated, group, the
  report's wording of the item, the value as printed, the numeric percent and a
  verbatim quote. rooney-questionnaire.tsv holds 30 item stems hand-copied from
  the two pinned questionnaires (29 from October 2025, 1 from May 2026), mapped
  to questionnaire block and letter. Numbers that appear only in chart images
  were not transcribed or estimated. `build` checks every quote and stem
  against the page text of the pinned PDFs and fails on any mismatch.
citation_full: >-
  Ethical Capital, Rooney Report transcription and questionnaire stems,
  corpus/democracy/rooney-transcription.tsv and
  corpus/democracy/rooney-questionnaire.tsv, added in commit
  7fcf0efed7e8ac5725c21a35ddd282fed8995e25 (2026-11-04) of the anthropic-pbc
  repository. Transcribed from Rooney Democracy Institute, University of Notre
  Dame, Rooney Reports 1-13 and the October 2025 and May 2026 questionnaires.
attribution_short: Ethical Capital (transcription); Rooney Democracy Institute (source text)
