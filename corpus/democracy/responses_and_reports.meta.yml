tables:
  corpus/democracy/MANIFEST.tsv:
    title: "Pins for every saved GDELT response and Rooney page or PDF"
    description: "One row per saved file in .democorpus/, sorted by source then item. Written by pin() in scripts/democracy_proxies.py."
    primary_key: [source, item]
    columns:
      "source":
        type: string
        description: "Producer of the pinned file."
        values:
          gdelt: "A GDELT DOC 2.0 or TV 2.0 API response (JSON)."
          rooney: "A Rooney Democracy Institute HTML page or PDF."
      "item":
        type: string
        description: >-
          Pin id. GDELT: doc_<query_id>_<mode> or tv_<query_id>_timelinevol_<percent|raw>.
          Rooney: listing, survey_page, R01-R13 (reports), CB_2025_10 and CB_2026_05 (questionnaires).
      "path":
        type: string
        description: "Path of the saved bytes relative to the gitignored .democorpus/."
      "url":
        type: string
        description: "Exact URL requested (GDELT: full API query string, including start and end datetimes)."
      "bytes":
        type: integer
        unit: bytes
        description: "Size of the saved response. A 2-byte GDELT TV response is `{}`: no matching clip in the whole span."
      "sha256":
        type: string
        description: "SHA-256 of the saved bytes, hex."
        hash_of: "the raw saved file bytes"
      "blake3":
        type: string
        description: "BLAKE3 of the saved bytes, hex."
        hash_of: "the raw saved file bytes"
      "as_of":
        type: date
        unit: YYYY-MM-DD
        description: "The --as-of argument recorded at fetch time (also the GDELT end date); not read from a clock."
