        type: number
        unit: "%"
        description: "Share of global HBM supply. Epoch: \"We then calculate the share of supply by dividing component demand by component supply.\" HBM demand \"is expressed in USD to match the market-level supply denominator.\" 95th percentile (P95) of the estimate. Epoch: \"All figures are estimates with 90% confidence intervals (P5 / P95) derived from 10,000 Monte Carlo simulation draws.\""
