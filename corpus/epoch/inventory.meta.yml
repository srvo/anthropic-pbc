        description: "Epoch: \"CoWoS cost is calculated as CoWoS wafers consumed multiplied by the relevant packaging wafer price.\" Median of the estimate (Epoch's Monte Carlo model, 10,000 draws)."
      "CoWoS cost (USD) (95th percentile)":
