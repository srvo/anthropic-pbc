        unit: "wafers"
        description: "CoWoS packaging wafers consumed. Epoch: \"CoWoS wafers = Units ÷ (PPW × packaging_yield)\", PPW being packages per CoWoS wafer. Median of the estimate (Epoch's Monte Carlo model, 10,000 draws)."
      "CoWoS wafers (95th percentile)":
        type: number
        unit: "wafers"
        description: "CoWoS packaging wafers consumed. Epoch: \"CoWoS wafers = Units ÷ (PPW × packaging_yield)\", PPW being packages per CoWoS wafer. 95th percentile (P95) of the estimate. Epoch: \"All figures are estimates with 90% confidence intervals (P5 / P95) derived from 10,000 Monte Carlo simulation draws.\""
      "CoWoS cost (USD) (5th percentile)":
        type: number
        unit: "USD"
        description: "Epoch: \"CoWoS cost is calculated as CoWoS wafers consumed multiplied by the relevant packaging wafer price.\" 5th percentile (P5) of the estimate. Epoch: \"All figures are estimates with 90% confidence intervals (P5 / P95) derived from 10,000 Monte Carlo simulation draws.\""
      "CoWoS cost (USD) (median)":
