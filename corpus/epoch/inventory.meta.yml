    primary_key: [field, subfield, tool, period]
    primary_key_note: "Epoch states the grain ('one row per tool, subfield and month'). Tested with duckdb on the committed file (17031 rows): ['source', 'field', 'subfield', 'tool', 'period'] has 17031 distinct combinations when an empty subfield counts as a value (unique), the same without source; 651 rows have an empty subfield (the whole-field rows). The key is Epoch's grain without the undocumented source column; subfield is the empty string on the whole-field rows, which is the value Epoch uses for them ('Rows with an empty subfield cover the whole field'), not a missing value."
    columns:
      "source":
        type: string
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
      "field":
        type: string
        description: "The field of the paper. Epoch: 'An arXiv paper belongs to a field according to its primary category'; the CSV has 'one row per field, subfield and month'."
      "subfield":
        type: string
        description: "The subfield. Epoch: 'Rows with an empty subfield cover the whole field.' 'The downloadable data keeps each arXiv category' and 'each bioRxiv category.'"
      "tool":
        type: string
        description: "The tool line: any_tool for any specialized AI tool; one row per category: protein_structure_design, image_analysis, single_cell, genomics; mass_spec_models for mass spectrometry models, which count toward any_tool but are not a category; and alphafold for AlphaFold."
      "period":
        type: string
        unit: "YYYY-MM"
        description: "The month of the row (the downloads page: 'one row per field, subfield and month'); papers are counted under the date of the first version of the paper."
