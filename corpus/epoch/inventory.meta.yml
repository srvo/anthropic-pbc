  corpus/epoch/ai-chip-components/quarterly_by_chip.csv:
    title: "AI chip components: quarterly consumption by chip"
    description: "One row per quarter, designer and chip type (plus an Other row per quarter): estimated consumption of advanced logic wafers, CoWoS packaging and HBM, their cost, and share of global supply, Q1 2024 to Q4 2025."
    columns_source: "https://epoch.ai/data/ai-chip-components-documentation/faq; https://epoch.ai/data/ai-chip-components-documentation/methodology (Component Cost Estimates, CoWoS/HBM consumption); https://epoch.ai/data/ai-chip-components-documentation"
    primary_key: ["Quarter", "Designer", "Chip type"]
    primary_key_note: "Epoch states no key. Tested with duckdb on the committed file (102 rows): [Quarter, Designer, Chip type] 102 distinct, no nulls (unique); [Name] also 102 distinct. Chose the composite."
    columns:
      "Name":
        type: string
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
      "Quarter":
        type: string
        description: "Quarter of consumption. Epoch: \"we attribute component demand to the quarter in which those inputs were consumed, rather than the quarter in which finished chips were sold.\""
      "Designer":
        type: string
        description: "Chip designer: NVIDIA, AMD, Google (TPUs) or Amazon (Trainium). Epoch: \"Each table also includes an “Other” row representing unattributed global supply: the residual after subtracting tracked designer demand from total global supply for that quarter.\""
      "Chip type":
        type: string
        description: "Chip type the row is attributed to. Epoch: \"Each row represents total supply chain consumption attributable to a chip type in a given quarter.\""
      "Start date":
        type: date
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
      "End date":
        type: date
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
      "Logic wafers (5th percentile)":
        type: number
        unit: "wafers"
        description: "Advanced-node logic wafers consumed. Epoch: \"3–5 nm wafers fabricated at TSMC (N3/N3E/N3P and N5/4N/4NP nodes), which form the silicon dies inside AI accelerators.\" 5th percentile (P5) of the estimate. Epoch: \"All figures are estimates with 90% confidence intervals (P5 / P95) derived from 10,000 Monte Carlo simulation draws.\""
      "Logic wafers (median)":
        type: number
        unit: "wafers"
        description: "Advanced-node logic wafers consumed. Epoch: \"3–5 nm wafers fabricated at TSMC (N3/N3E/N3P and N5/4N/4NP nodes), which form the silicon dies inside AI accelerators.\" Median of the estimate (Epoch's Monte Carlo model, 10,000 draws)."
      "Logic wafers (95th percentile)":
        type: number
        unit: "wafers"
        description: "Advanced-node logic wafers consumed. Epoch: \"3–5 nm wafers fabricated at TSMC (N3/N3E/N3P and N5/4N/4NP nodes), which form the silicon dies inside AI accelerators.\" 95th percentile (P95) of the estimate. Epoch: \"All figures are estimates with 90% confidence intervals (P5 / P95) derived from 10,000 Monte Carlo simulation draws.\""
      "Logic cost (USD) (5th percentile)":
        type: number
        unit: "USD"
        description: "Epoch: \"Logic cost is calculated as logic wafers consumed multiplied by the relevant node-specific wafer price.\" 5th percentile (P5) of the estimate. Epoch: \"All figures are estimates with 90% confidence intervals (P5 / P95) derived from 10,000 Monte Carlo simulation draws.\""
      "Logic cost (USD) (median)":
        type: number
        unit: "USD"
        description: "Epoch: \"Logic cost is calculated as logic wafers consumed multiplied by the relevant node-specific wafer price.\" Median of the estimate (Epoch's Monte Carlo model, 10,000 draws)."
      "Logic cost (USD) (95th percentile)":
        type: number
        unit: "USD"
        description: "Epoch: \"Logic cost is calculated as logic wafers consumed multiplied by the relevant node-specific wafer price.\" 95th percentile (P95) of the estimate. Epoch: \"All figures are estimates with 90% confidence intervals (P5 / P95) derived from 10,000 Monte Carlo simulation draws.\""
      "Logic share (%) (5th percentile)":
        type: number
        unit: "%"
        description: "Share of global logic wafer supply. Epoch: \"We then calculate the share of supply by dividing component demand by component supply.\" 5th percentile (P5) of the estimate. Epoch: \"All figures are estimates with 90% confidence intervals (P5 / P95) derived from 10,000 Monte Carlo simulation draws.\""
      "Logic share (%) (median)":
        type: number
        unit: "%"
        description: "Share of global logic wafer supply. Epoch: \"We then calculate the share of supply by dividing component demand by component supply.\" Median of the estimate (Epoch's Monte Carlo model, 10,000 draws)."
      "Logic share (%) (95th percentile)":
        type: number
        unit: "%"
        description: "Share of global logic wafer supply. Epoch: \"We then calculate the share of supply by dividing component demand by component supply.\" 95th percentile (P95) of the estimate. Epoch: \"All figures are estimates with 90% confidence intervals (P5 / P95) derived from 10,000 Monte Carlo simulation draws.\""
      "CoWoS wafers (5th percentile)":
        type: number
        unit: "wafers"
        description: "CoWoS packaging wafers consumed. Epoch: \"CoWoS wafers = Units ÷ (PPW × packaging_yield)\", PPW being packages per CoWoS wafer. 5th percentile (P5) of the estimate. Epoch: \"All figures are estimates with 90% confidence intervals (P5 / P95) derived from 10,000 Monte Carlo simulation draws.\""
      "CoWoS wafers (median)":
