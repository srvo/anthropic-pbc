      "HBM share (%) (median)":
        type: number
        unit: "%"
        description: "Share of global HBM supply. Epoch: \"We then calculate the share of supply by dividing component demand by component supply.\" HBM demand \"is expressed in USD to match the market-level supply denominator.\" Median of the estimate (Epoch's Monte Carlo model, 10,000 draws)."
