  corpus/epoch/frontier-lab-hiring/frontier_lab_hiring_postings.csv:
    title: "Postings"
    description: "One row per posting ever observed: its lifetime in the archive, its label and its location."
    columns_source: "frontier_lab_hiring.zip README.md (Files section), pinned bundle .epochcorpus/frontier-lab-hiring/frontier_lab_hiring.zip; https://epoch.ai/data/frontier-lab-hiring-documentation/records#postings"
    primary_key: [posting]
    primary_key_note: "Epoch: frontier_lab_hiring_postings.csv 'has exactly one row per posting'. Confirmed with duckdb on the committed file (4055 rows): [posting] unique, no nulls."
    columns:
      "posting":
        type: string
        description: "Posting key (e.g. Anthropic:123, OpenAI:<uuid>), stable across the files in this ZIP."
      "lab":
        type: string
        description: "\"Anthropic\" or \"OpenAI\"."
      "category":
        type: string
        description: "The posting's category (group), implied by its sub-category."
      "subcategory":
        type: string
        description: "The posting's sub-category."
      "confidence":
        type: string
        description: "\"high\", \"medium\" or \"low\": how clearly the advert fitted its sub-category. high: the title and the duties described agree on the sub-category; medium: the department or a close reading of the advert was needed to decide; low: two sub-categories were genuinely arguable, or the advert says too little to be sure."
      "title":
        type: string
        description: "The posting's latest observed job title."
      "first_seen":
        type: date
        unit: "YYYY-MM-DD"
        description: "First scrape date on which the posting appeared."
      "last_seen":
        type: date
