  "corpus/epoch/gpu-clusters/gpu_clusters.csv":
    title: "GPU clusters"
    description: "One row per GPU cluster record: \"the details of a GPU cluster at a point in time, typically the first date it became operational\"; an upgrade that substantially changes a cluster becomes a new record (https://epoch.ai/data/gpu-clusters-documentation/records). Epoch marks the dataset deprecated in favour of the AI data centers database (https://epoch.ai/data/gpu-clusters). Chinese systems are anonymized: names concealed and numeric fields rounded to one significant figure (records page, \"Chinese data\")."
    columns_source: "https://epoch.ai/data/gpu-clusters-documentation/records#fields"
    primary_key: null
    primary_key_reason: "No unique key: Epoch states none, Name is not unique (190 rows are named 'Anonymized Chinese System'), and whole rows are not unique either (437 distinct rows of 482)."
    primary_key_note: "Epoch states no key. Tested with duckdb on the committed file (482 rows): [Name] 293 distinct; [Name, First Operational Date] 348; [Name, Chip quantity (primary)] 313; [Name, Location] 294; [Name, Certainty] 294; [Name, Country] 294; [Name, Status], [Name, Chip type (primary)], [Name, Owner], [Name, Source 1] 293 each; all columns together 437 distinct. None unique."
    columns:
      "Name":
        type: string
        description: "The owner’s name, followed by the cluster name used in the most official announcement. If the name or the owner’s name is unknown, then other identifying information may be used to distinguish the supercomputer (such as location, year, chip type, an index, etc). Supercomputers that have several phases are notated by “Phase 1”, “Phase 2”, etc"
      "Status":
        type: string
        description: "Existing: The supercomputer (as described in this entry) is believed to be operational (>80% of the GPUs available for training) Planned: The supercomputer is not yet operational, and this entry describes plans for when it will be operational. Decomissioned: The supercomputer used to exist, but has since been decomissioned."
      "Certainty":
        type: string
        description: "How likely does (or will) this cluster exist as roughly as specified? Confirmed: Official announcement that seems highly trustworthy or expert confirmation. Corresponds to >90% certainty. Likely: Cluster most likely exists/ will exist roughly in the specified form. 50-90% certainty. Unlikely: Cluster probably doesn’t/won’t exist roughly in the specified form. 10-50% certainty Confirmed false: Cluster does not/ will not exist roughly in the specified form. Use e.g. if an expert or media report revealed earlier announcements were wrong. (90% or more likely the cluster does not exist in roughly the specified form)"
      "Single cluster?":
        type: boolean
        description: "Yes: The source clearly implies a single supercomputers deployed on a continuous campus without significant physical separation, connected by high-bandwidth networking fabric, forming a single system. There is no evidence otherwise Unclear: No compelling evidence either way. No: The cluster the source refers to is, in fact, several distinct supercomputers."
      "Max OP/s (log)":
        type: number
        unit: "log10 OP/s"
        description: "The base 10 logrithm of the maximum theorhetical operations per second the superocmputer can achieve (out of 32, 16, or 8 bit performance)"
      "H100 equivalents":
        type: number
        unit: "H100e"
        description: "Divides the supercomputer’s Max OP/s field (in 32, 16, or 8 bit) by an H100’s FP8 FLOP/s. Note, H100 equivalents isn’t a well defined measurement, and this number should be treated more as a “sense” instead of a precise measurement. It works fairly well for comparisons among supercomputers since ~2021, but makes less sense for older supercomputers."
      "Chip type (primary)":
        type: string
        description: "The primary AI chip used in the supercomputer. This links to a specific chip in the Epoch ML Hardware Database."
      "Chip quantity (primary)":
        type: number
        unit: "chips"
        description: "Total number of the primary AI chips in the supercomputer. A GB200 is counted as two AI chips for this dataset."
      "Country":
        type: string
        description: "Country in which the supercomputer is physically located."
      "Owner":
        type: string
        description: "The entity that owns the AI supercomputer itself (the hardware within the datacenter). This can include several entity if it is a joint venture. This can sometimes differ from the entity that owns the datacenter itself, or the entity that has a long term arrangement to rent the supercomputer."
      "First Operational Date":
        type: date
        unit: "YYYY-MM-DD"
        description: "When the supercomputer was first fully operational (ie, you could run a workload on at least 80% of the cluster). This will often be an approximation to the nearest month or so, since the exact data a supercomputer became operational is rarely announced. By default, we are conservative with this date, and set it to the first date that we have confirmation that it was operational, which will often be a few months after it was actually first operational. This data field is of date type, and will automatically be calculated based on the text in the “First operational note” field"
      "Note":
        type: string
        description: "Notes that give additional context or helpful information about the supercomputer."
      "Sector":
        type: string
        description: "Private: Owned by a commercial entity. Public: Owned by a government or university Public/Private: A colaboration between private company and government or university if actors from the public and private sectors have both paid for at least 25% of the supercomputer."
      "Power Capacity (MW)":
        type: number
        unit: "MW"
        description: "The peak power capacity of the system, in megawatts. Will be the reported power capacity if available, and the calculated power capacity if not."
      "Hardware Cost":
        type: number
        unit: "2025 USD"
        description: "The cost to acquire the hardware for the system in 2025 US dollars. Includes the cost for the GPUs, CPUs, networking, etc, but not the datacenter itself. Will be the reported hardware cost if it exists, and the calculated hardware cost otherwise."
      "Location":
        type: string
        description: "Specific location where the supercomputer is physicaly located."
      "Users":
        type: string
        description: "Any significant entities known to use the supercomputer. “Cloud” refers to the supercomputer being offered publicly via the cloud. Will often just be the owner."
      "Hardware note":
        type: string
        description: "Note to describe the all the AI chips in the supercomputer."
      "Quote":
        type: string
        description: "A quote from the source specifying the number of and type of chips and/or the reported or manual FLOP/s number if applicable."
      "First Operational Date Note":
        type: string
        description: "When the supercomputer was first fully operational (ie, you could run a workload on at least 80% of the cluster). This will often be an approximation to the nearest month or so, since the exact data a supercomputer became operational is rarely announced. By default, we are conservative with this date, and set it to the first date that we have confirmation that it was operational, which will often be a few months after it was actually first operational. Will be “Planned” or “Planned for [date]” if supercomputer in construction or planned"
      "Certainty Note":
        type: string
        description: "A briefly explanation of why the given certainty level was selected"
      "Energy Efficiency (log)":
        type: number
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
      "Builds Upon":
        type: string
        description: "If a supercomputer was built in multiple phases, this links to the supercomputer corresponding to the preceding phase."
      "Superseded by":
        type: string
        description: "If a supercomputer has a later phase (eg, was upgraded later in time), and that phase is already operational, this links to the supercomputer entry corresponding to that phase"
      "Possible Duplicate":
        type: string
        description: "True if we think there is a >20% chance that this supercomputer is a duplicate of a supercomputer that already exists in this database. In circumstances where we think two entries might correspond to the same supercomputer, we will mark this field False for the entry with which we have more information, and True for the entry with which we have less information (this allows the user to filter out all entries with “Possible Duplicate”=True for analysis)"
        source_field: "Possible duplicate"
        note: "Empty in every row of the committed file; type is duckdb's default for an all-null column."
      "Possible Duplicate Of":
        type: string
        description: "If “Possible duplicate” is marked True, this will link to the entry that we think this supercomputer is a duplicate of"
      "Chip type (secondary)":
        type: string
        description: "The secondary AI chip used in the supercomputer, if there was any. This links to a specific chip in the Epoch ML Hardware Database."
      "Chip quantity (secondary)":
        type: integer
        unit: "chips"
        description: "Total number of the secondary AI chips in the supercomputer, if there are any. A GB200 is counted as two AI chips for this dataset."
      "Total number of AI chips":
        type: number
        unit: "chips"
        description: "Corresponds to the number of AI chips in the supercomputer. Maxium of {Primary AI chip quantity + Secondary AI chip quantity; Manual total chips number; number of chips calculated from FLOP/s}"
      "GPU Supplier (primary)":
        type: string
        description: "The GPU supplier for the Primary AI Chip type"
        source_field: "GPU supplier (primary)"
      "GPU supplier (secondary)":
        type: string
        description: "The GPU supplier for the Secondary AI Chip type (if applicable)"
      "Include in Standard Analysis":
        type: boolean
        description: "True if this entry qualified to be used in the analyses we used for the original paper. That is, (Status=“Existing” or “Decomissioned”) AND (Exclude=False) AND (Certainty = “Confirmed” or “Likely”) AND (Possible Duplicate=False) AND (Single Cluster?=“Yes”) False otherwise"
      "Exclude":
        type: string
        description: "True if the entry should be excluded from analyses. This could be becase it falls below the inclusion threshold, or there is another reason for excluding it. False otherwise."
        note: "Empty in every row of the committed file; type is duckdb's default for an all-null column."
      "Rank when first operational":
        type: integer
        unit: "rank"
        description: "This supercomputer’s rank in the world by performance (FLOP/s, maximum of 32, 16, or 8 bit precision) the day it first became operational"
      "16-bit OP/s (log)":
        type: number
        unit: "log10 FLOP/s"
        description: "Base 10 logrithm of the maximum theorhetical performance of the supercomputer in 16-bit FLOP/s"
      "Max OP/s":
        type: number
        unit: "OP/s"
        description: "The maximum theorhetical operations per second the superocmputer can achieve (out of 32, 16, or 8 bit performance)"
      "8-bit OP/s":
        type: integer
        unit: "OP/s"
        description: "The maximum theorhetical operations per second the superocmputer can achieve in 8-bit numerical precision"
      "16-bit OP/s":
        type: integer
        unit: "FLOP/s"
        description: "The maximum theorhetical operations per second the superocmputer can achieve in 16-bit numerical precision"
      "32-bit OP/s":
        type: number
        unit: "OP/s"
        description: "The maximum theorhetical operations per second the superocmputer can achieve in 32-bit numerical precision"
      "Calculated Power Capacity (MW)":
        type: number
        unit: "MW"
        description: "The calculated power capacity of the supercomputer in megawatts based on the number and type of chips. See paper for full methodology"
      "Reported Power Capacity (MW)":
        type: number
        unit: "MW"
        description: "Reported power capacity of the supercomputer in megawatts"
        source_field: "Reported power capacity (MW)"
      "Energy Efficiency":
        type: number
        description: "Log of the 16-bit FLOP/s per watt. The numerator is the theorhetical max 16-bit FLOP/s of the system, and the denomenator is the peak power capacity of the system."
        note: "Epoch's definition says log, but the committed values run from about 1.2e10 to 2.9e12, so they are not logged; 'Energy Efficiency (log)' holds values from about 10.1 to 12.5. Recorded as observed, not resolved."
      "Calculated Cost":
        type: number
        unit: "2025 USD"
        description: "Calculates the cost (in 2025 US dollars) based on number and type of chips. See paper for full methodology"
      "Reported Cost":
        type: integer
        unit: "USD (nominal, at the time)"
        description: "Reported total cost of the supercomputer in US dollars at the time."
      "Reported Cost (Inflation adjusted)":
        type: number
        unit: "2025 USD"
        description: "Reported total cost of the supercomputer, adjusted to 2025 US dollars"
      "Cost Quote":
        type: string
        description: "Quote from the source saying how much the supercomputer cost. Might refer to a currency besides dollars, or not yet be inflation adjusted"
      "Noteworthy":
        type: boolean
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
      "Decommissioned Date (if applicable)":
        type: string
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
        note: "Empty in every row of the committed file; type is duckdb's default for an all-null column."
      "Largest existing cluster when first operational":
        type: string
        description: "The name of the largest known supercomputer existing on the first operaitonal date of this supercomputer"
      "% of largest cluster when first operational":
        type: number
        unit: "ratio"
        description: "The maximum theorhetical FLOP/s (32, 16, or 8 bit) for the this supercomputer, divided by the maximum theorhetical FLOP/s for the largest known supercomputer existing at the time."
        note: "Values in the committed file run from 0.01 to 1.0 (a ratio, despite the % in the header)."
      "Source 1":
        type: string
        description: "URL for source on the AI supercomputer. Generally saved as a Wayback Machine link to preserve the link"
        source_field: "Source 1 (through Source n)"
      "Source 2":
        type: string
        description: "URL for source on the AI supercomputer. Generally saved as a Wayback Machine link to preserve the link"
        source_field: "Source 1 (through Source n)"
      "Source 3":
        type: string
        description: "URL for source on the AI supercomputer. Generally saved as a Wayback Machine link to preserve the link"
        source_field: "Source 1 (through Source n)"
      "Source 4":
        type: string
        description: "URL for source on the AI supercomputer. Generally saved as a Wayback Machine link to preserve the link"
        source_field: "Source 1 (through Source n)"
      "Source 5":
        type: string
        description: "URL for source on the AI supercomputer. Generally saved as a Wayback Machine link to preserve the link"
        source_field: "Source 1 (through Source n)"
      "latitude":
        type: number
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
      "longitude":
        type: number
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
  "corpus/epoch/machine-learning-hardware/ml_hardware.csv":
    title: "Machine learning hardware"
    description: "One row per AI accelerator or processor (GPU, TPU, CPU or other) in Epoch's machine learning hardware dataset, with specifications, provenance and metadata (https://epoch.ai/data/machine-learning-hardware-documentation/records)."
    columns_source: "https://epoch.ai/data/machine-learning-hardware-documentation/records#records"
    primary_key: ["Hardware name"]
    primary_key_note: "Epoch states no key; its records page says hardware variations \"should be named distinctly\". Tested with duckdb on the committed file (183 rows): [Hardware name] 183 distinct, no nulls: unique."
    columns:
      "Hardware name":
        type: string
        description: "The full name of the hardware, including the manufacturer. For example, “Google TPU v5p”. Note that there can be different variations of hardware based on similar chips, which should be named distinctly, for example “NVIDIA H100 SXM5 80GB” versus “NVIDIA H100 PCIe”."
      "Manufacturer":
        type: string
        description: "The manufacturer of the hardware."
      "Type":
        type: string
        description: "Indicates whether the hardware is a central processing unit (CPU), graphics processor (GPU), or tensor processor (TPU). For a small number of experimental other accelerators, such as the Meta MTIA series, this is “Other”."
      "Notes":
        type: string
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
      "Release date":
        type: date
        unit: "YYYY-MM-DD"
        description: "The date when the hardware could first be rented, used for machine learning workloads, or purchased (excluding pre-orders)."
      "Release price (USD)":
        type: number
        unit: "USD (nominal)"
        description: "Price of the processor when released, in nominal US dollars. Prices are collected from hardware catalogs, news sources, or other documentation. Listed prices do not reflect bulk discounts."
      "Tensor-FP16/BF16 performance (FLOP/s)":
        type: number
        unit: "FLOP/s"
        description: "These are performance figures for tensor operations, specifically optimized for AI training."
      "FP8 performance (FLOP/s)":
        type: number
        unit: "FLOP/s"
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
      "FP4 performance (FLOP/s)":
        type: number
        unit: "FLOP/s"
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
      "Memory (bytes)":
        type: number
        unit: "bytes"
        description: "The hardware’s amount of memory, in bytes."
        source_field: "Memory size per board (byte)"
      "Memory bandwidth (byte/s)":
        type: number
        unit: "byte/s"
        description: "Rate of data transfer between memory and processor, in bytes per second."
      "Intranode bandwidth (byte/s)":
        type: number
        unit: "byte/s"
        description: "Data transfer rate within a single node, in bytes per second. Nodes typically consist of servers which may contain CPUs, GPUs, memory, storage, etc."
      "Internode bandwidth (bit/s)":
        type: number
        unit: "bit/s"
        description: "Data transfer rate between separate nodes, in bits per second. Nodes typically consist of servers which may contain CPUs, GPUs, memory, storage, etc."
      "TDP (W)":
        type: number
        unit: "W"
        description: "Thermal design power, the theoretical maximum power that can be dissipated as heat. In theory, this is the maximum sustainable power draw for a given chip."
      "FP64 (double precision) performance (FLOP/s)":
        type: number
        unit: "FLOP/s"
        description: "These are performance figures for non-tensor operations, at different numerical precisions. Beginning in 2017, ML hardware added tensor cores specifically to optimize tensor operations, which are commonly used in AI training."
      "FP32 (single precision) performance (FLOP/s)":
        type: number
        unit: "FLOP/s"
        description: "These are performance figures for non-tensor operations, at different numerical precisions. Beginning in 2017, ML hardware added tensor cores specifically to optimize tensor operations, which are commonly used in AI training."
      "TF32 (TensorFloat-32) performance (FLOP/s)":
        type: number
        unit: "FLOP/s"
        description: "These are performance figures for tensor operations, specifically optimized for AI training."
      "FP16 (half precision) performance (FLOP/s)":
        type: number
        unit: "FLOP/s"
        description: "These are performance figures for non-tensor operations, at different numerical precisions. Beginning in 2017, ML hardware added tensor cores specifically to optimize tensor operations, which are commonly used in AI training. FP16 data excludes processors with greater performance in FP32 than in FP16, because these are not designed to support half-precision calculations."
      "INT16 performance (OP/s)":
        type: number
        unit: "OP/s"
        description: "These are performance figures for integer operations, at different numerical precisions."
      "INT8 performance (OP/s)":
        type: number
        unit: "OP/s"
        description: "These are performance figures for integer operations, at different numerical precisions."
      "INT4 performance (OP/s)":
        type: number
        unit: "OP/s"
        description: "These are performance figures for integer operations, at different numerical precisions."
      "Foundry":
        type: string
        description: "The semiconductor manufacturer responsible for producing the processor die or chip in a foundry or fabrication plant."
      "Die Size (mm^2)":
        type: number
        unit: "mm^2"
        description: "The physical size or area of the processing chip, in square millimeters."
        source_field: "Die size (mm^2)"
      "Base clock (MHz)":
        type: number
        unit: "MHz"
        description: "Default operating frequency of the processor, in megahertz."
      "Boost clock (MHz)":
        type: number
        unit: "MHz"
        description: "Maximum operating frequency of the processor, in megahertz."
      "Memory clock (MHz)":
        type: number
        unit: "MHz"
        description: "Operating frequency of the processor’s memory, in megahertz."
      "Memory bus (bit)":
        type: number
        unit: "bit"
        description: "Amount of data that can be transferred between the memory and processor per cycle, in bits."
      "Tensor cores":
        type: number
        unit: "tensor cores"
        description: "Number of tensor cores, a specialized NVIDIA hardware component designed to accelerate matrix and tensor operations."
      "Process size (nm)":
        type: number
        unit: "nm"
        description: "Nominal semiconductor manufacturing scale, in nanometers."
      "Transistors (millions)":
        type: number
        unit: "millions of transistors"
        description: "Number of transistors in the processor, in millions."
        source_field: "Number of transistors (millions)"
      "Link to datasheet":
        type: string
        description: "Links to document(s) containing specifications or data about the processor."
      "Source for the price":
        type: string
        description: "Link to source(s) listing the price of the hardware."
      "ML models":
        type: string
        description: "ML models trained with this hardware, cross-referenced from our database of models."
      "Last modified":
        type: timestamp
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
      "Max performance":
        type: number
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
      "Energy efficiency":
        type: number
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
      "Total processing performance (bit-OP/s)":
        type: number
        unit: "bit-OP/s"
        description: "Total Processing Performance (TPP) is the maximum theoretical performance of the hardware, measured in bit-operations per second (bit-op/s). It is calculated by multiplying the maximum operations per second for each supported numeric format by the bit width of that format, then using the format that produces the highest value."
      "Price-performance":
        type: number
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
      "ML OP/s":
        type: number
        unit: "FLOP/s or OP/s"
        description: "Maximum performance in any format 8 bits or wider, in units of FLOP/s or OP/s."
      "Inference Capacity Index (GB300e)":
        type: number
        unit: "GB300e (GB300 in an NVL72 rack = 1)"
        description: "Modeled inference capacity per accelerator on agentic workloads, relative to GB300 in an NVL72 rack (GB300 = 1); see the methodology. It counts both generating output and processing new input, averaged across four models and output speeds of 50–400 tokens/s per request."

