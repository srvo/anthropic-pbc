# Metadata for data://meadow/epoch/2026-11-04/inventory (praxis/datasets/metadata.schema.yml)
#
# Column meanings come only from Epoch's own documents, named per table in
# `columns_source`. Where Epoch does not define a column, `description` is null
# with a reason; nothing is inferred from a column name. `source_field` gives
# Epoch's field name where it differs from the CSV header.
title: Epoch AI datasets, inventory and verbatim tables, snapshot 2026-11-04
uri: data://meadow/epoch/2026-11-04/inventory
channel: meadow
origins: [snapshot://epoch/2026-11-04/all_datasets]
description: >-
  An inventory of every member of the 18 pinned Epoch AI files (one row per
  zip member, gz payload or standalone file), plus byte-identical copies of the
  68 CSV tables that are small enough to commit and that Epoch licenses itself.
  The tables are Epoch's, unmodified; this step adds only the inventory.
processing: >-
  Re-hash every pinned file against MANIFEST.tsv and stop on any mismatch.
  Unpack each file (zip members in name order, the gz payload, or the file
  itself) and record per member its kind, bytes, BLAKE3 and, for CSVs, data
  rows (header and leading '#' lines excluded), column count, column names and
  the number of rows with "anthropic" in any cell, any letter case. Copy CSV
  members under 5,000,000 bytes byte-for-byte to corpus/epoch/<dataset>/.
  Drops from the committed copies: the 67 third-party benchmarks/*_external.csv
  tables (original licences), three CSVs of 5,000,000 bytes or more
  (all_ai_models.csv, math_acknowledgment_trends_monthly.csv,
  frontier_lab_hiring_posting_texts.csv), the bundle README.md files and
  eci_bootstraps.json. All of these remain listed in inventory.tsv with their
  hashes. Code: scripts/epoch_data.py build; `verify` rebuilds in memory and
  compares BLAKE3.
unit_of_analysis: >-
  inventory.tsv: one member of a pinned Epoch file. Each copied table keeps
  Epoch's own row unit, stated per table below.
denominator: >-
  corpus/epoch/inventory.tsv (all 150 members of the 18 pinned files, committed
  or not; the committed column says which 68 are copied here).
coverage: >-
  Epoch's public downloads as listed at https://epoch.ai/data on 2026-11-04:
  15 of the 17 listed datasets (Cyber vulnerabilities is in corpus/cve/;
  ChatGPT usage is excluded under YouGov's no-AI-ingestion notice). Each
  dataset's own time coverage and "Updated" date differ (2026-03-13 to
  2026-11-04; see snapshot.meta.yml). Not committed, local only: three large
  CSVs, the 67 external benchmark tables, the arxiv dataset's only table, and
  the non-CSV bundle members.
does_not_answer:
  - "Whether Epoch's estimates are right: most chip, compute and cost figures are Epoch's modelled estimates with stated intervals, not measurements, and this step does not check them."
  - "What changed at Epoch between snapshots: Epoch revises history in place without versioned URLs, so a comparison needs two pins and the per-table BLAKE3 in inventory.tsv."
  - "Anything about a row that mentions Anthropic: anthropic_rows is a case-insensitive substring count over every cell (lab names, model developers, source URLs alike), a pointer for joins, not a finding."
  - "The meaning of columns that Epoch does not document: those are declared unknown below, not guessed."
license:
  name: CC BY 4.0 (Epoch AI); this folder is not covered by the repository's CC0 dedication
  url: https://creativecommons.org/licenses/by/4.0/
status: held
tables:
  corpus/epoch/inventory.tsv:
    title: "Inventory of pinned Epoch files and their members"
    description: "One row per member of each pinned file in MANIFEST.tsv: zip members, the decompressed gz payload, or a standalone CSV. Written by scripts/epoch_data.py build."
    columns_source: "scripts/epoch_data.py (compute, table_stats, committable); corpus/epoch/README.md"
    primary_key: [dataset, file, member]
    primary_key_note: "Our table. Tested with duckdb on the committed file (150 rows): (dataset, file, member) has 150 distinct values, unique, but member is the empty string on the 6 rows where the pinned file is itself a plain CSV. The key is unique with empty member treated as a value, not as null. blake3 alone is not unique (149 distinct: ai-chip-sales/chip_types.csv and ai-data-centers/chip_types.csv are byte-identical)."
    columns:
      "dataset":
        type: string
        description: "Dataset id: the slug of Epoch's dataset page (as in MANIFEST.tsv and CITATIONS.tsv)."
      "file":
        type: string
        description: "The pinned file the member comes from, path under .epochcorpus/<dataset>/."
      "member":
        type: string
        description: "Member name inside the pinned file (zip path); empty when the pinned file is itself a plain CSV. For the gz file, member is the payload name (the file name without .gz)."
      "kind":
        type: string
        description: "File extension of the member, lower case."
        values: {csv: "a table", md: "a README", json: "a JSON document (eci_bootstraps.json)"}
      "bytes":
        type: integer
        unit: bytes
        description: "Size of the member's bytes (decompressed for zip and gz)."
      "rows":
        type: integer
        unit: rows
        description: "CSV only: data rows, excluding the header, leading '#' comment lines and empty lines. Empty for non-CSV members."
      "columns":
        type: integer
        unit: columns
        description: "CSV only: number of columns in the header. Empty for non-CSV members."
      "column_names":
        type: string
        description: "CSV only: the header as a JSON array of strings, verbatim. Empty for non-CSV members."
        verbatim: true
      "blake3":
        type: string
        description: "BLAKE3 of the member's bytes."
        hash_of: "the member's bytes as extracted (decompressed), not the containing file"
      "anthropic_rows":
        type: integer
        unit: rows
        description: "CSV only: data rows in which any cell matches 'anthropic' in any letter case (substring match); a row counts once. Empty for non-CSV members."
      "committed":
        type: string
        description: "Path under corpus/epoch/ of the verbatim copy, when the member is a CSV under 5,000,000 bytes and not a *_external.csv table; empty otherwise."
      "note":
        type: string
        description: "Why a CSV member is not committed; empty otherwise."
        values:
          "third-party benchmark data, original licence; local only": "a benchmarks/*_external.csv table"
          ">= 5000000 bytes; local only": "a CSV at or above the commit size limit"

