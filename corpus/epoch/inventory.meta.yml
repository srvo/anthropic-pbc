        description: "The taxonomy version under which this version was classified, as a version string such as \"v1.0\". It changes when Epoch revises the taxonomy or the classification instructions, and when it judges that a change of language model warrants a new version."

  # ---------------------------------------------------------------- models
  "corpus/epoch/ai-models/frontier_ai_models.csv":
    title: "Frontier AI models"
    description: "One row per model in Epoch's AI models database that is a frontier model: \"models that were in the top 5 of training compute as of the time of their release\" (https://epoch.ai/data/ai-models-documentation/downloads)."
    columns_source: "https://epoch.ai/data/ai-models-documentation/records#fields"
    primary_key: ["Model"]
    primary_key_note: "Epoch states: Model \"should be unique within the database ... and is used as the primary key for indexing entries in the dataset\" (https://epoch.ai/data/ai-models-documentation/records#fields). Confirmed with duckdb on the committed file: 138 rows, 138 distinct non-null Model values."
    columns:
      "Model":
        type: string
        description: "The name of the model. This should be unique within the database, and should be the best-known name for a given model. This column must be filled in, and is used as the primary key for indexing entries in the dataset."
      "Publication date":
        type: date
        unit: "YYYY-MM-DD"
        description: "The publication, announcement, or release date of the model, in YYYY-MM-DD format. If the year and month are known but the day is unknown, the day is filled in as YYYY-MM-15. If the year is known but the month and day are unknown, the month and day are filled in as YYYY-07-01."
      "Organization":
        type: string
        description: "Organization(s) who created the model. Organizations may have multiple different names, but we aim to standardize organization names where they refer to the same organization. Therefore, organizations are periodically reviewed in Airtable and standardized to the most common name for them. For example, “University of California, Berkeley” and “Berkeley” have been changed to “UC Berkeley”. Note that some organizations have similar names but genuinely are different organizations, for example Google Brain versus Google versus Google DeepMind."
      "Training compute (FLOP)":
        type: number
        unit: "FLOP"
        description: "Quantity of compute used to train the model, in FLOP. This is the total training compute for a given model, i.e. pretrain + finetune. It should be filled in here when directly reported, or calculated via GPU-hours or backpropagation gradient updates. Further guidance is provided in Estimation."
      "Training compute notes":
        type: string
        description: "Metadata documenting the reasoning and/or evidence for a given column, e.g. training compute or dataset size. This is particularly important to note in cases where such information isn’t obvious. This field is unstructured text."
        source_field: "Notes fields, e.g. “Training compute notes”"
      "Domain":
        type: string
        description: "The machine learning domain(s) of application associated with the model. This is fairly high-level, for example “Language” incorporates many different ML tasks."
      "Task":
        type: string
        description: "The finegrained task(s) that the model is designed to perform. These are specific applications of the model to different problems, and can span multiple domains. Task labels are assigned by following a flowchart. Each applicable branch of the flowchart is followed until a leaf node is reached. If the task is already in the database, the model is tagged with that task. If the task does not yet exist in the database, the model is tagged with that task and the task is added to the flowchart. Examples: Face recognition Visual question answering Tic Tac Toe Weather forecasting"
      "Link":
        type: string
        description: "Link(s) to best-choice sources documenting a model. This should preferentially be a journal or conference paper, preprint, or technical report. If these are not available, the links should point to other supporting evidence, such as an announcement post, a news article, or similar."
      "Parameters":
        type: number
        unit: "parameters"
        description: "Number of learnable parameters in the model. For neural networks, these are the weights and biases. Further information is provided in Estimation."
      "Parameters notes":
        type: string
        description: "Metadata documenting the reasoning and/or evidence for a given column, e.g. training compute or dataset size. This is particularly important to note in cases where such information isn’t obvious. This field is unstructured text."
        source_field: "Notes fields, e.g. “Training compute notes”"
      "Authors":
        type: string
        description: "Comma-separated list of authors. Authors are named in the way that they report their names in their publications, if applicable. For example, Lê Viết Quốc is credited as “Quoc V. Le” in his publications."
      "Notability criteria":
        type: string
        description: "The criteria met by the model which qualify it for notability. To be notable, a model must meet at least one criterion. Possible values are highly cited, large training cost, significant use, state of the art, or historical significance. These are discussed further in Inclusion."
      "Notability criteria notes":
        type: string
        description: "Metadata documenting the reasoning and/or evidence for a given column, e.g. training compute or dataset size. This is particularly important to note in cases where such information isn’t obvious. This field is unstructured text."
        source_field: "Notes fields, e.g. “Training compute notes”"
      "Model accessibility":
        type: string
        description: "The accessibility of the model in terms of whether the model weights can be downloaded or, if the model weights are not accessible, whether the model can be used in an API or product."
      "Citations":
        type: number
        unit: "citations"
        description: "Number of citations as of last update. Values are collected from Semantic Scholar where available, otherwise manually from Google Scholar."
      "Reference":
        type: string
        description: "The literature reference for the model, such as the title of the journal or conference paper, academic preprint, or technical report."
      "Training dataset":
        type: string
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
      "Training dataset notes":
        type: string
        description: "Metadata documenting the reasoning and/or evidence for a given column, e.g. training compute or dataset size. This is particularly important to note in cases where such information isn’t obvious. This field is unstructured text."
        source_field: "Notes fields, e.g. “Training compute notes”"
      "Dataset size notes":
        type: string
        description: "Metadata documenting the reasoning and/or evidence for a given column, e.g. training compute or dataset size. This is particularly important to note in cases where such information isn’t obvious. This field is unstructured text."
        source_field: "Notes fields, e.g. “Training compute notes”"
      "Epochs":
        type: number
        unit: "epochs"
        description: "How many epochs (repetitions of the training dataset) was used to train the model."
      "Training time (hours)":
        type: number
        unit: "hours"
        description: "Training time of the model, if reported. This refers to the time elapsed during the training process, not the number of chip-hours. For example, if a model were trained with 10 GPUs for 1 hour, the training time would be 1 hour. Includes the duration of all training phases conducted to develop the model, such as pre-training, post-training, RL, SFT, etc. If the model is fine-tuned from a previously published model, then that base model’s training time is not included."
      "Training time notes":
        type: string
        description: "Metadata documenting the reasoning and/or evidence for a given column, e.g. training compute or dataset size. This is particularly important to note in cases where such information isn’t obvious. This field is unstructured text."
        source_field: "Notes fields, e.g. “Training compute notes”"
      "Training hardware":
        type: string
        description: "Type of training hardware used. Entries are cross-referenced against Epoch AI’s database of ML training hardware."
      "Compute cost notes":
        type: string
        description: "Metadata documenting the reasoning and/or evidence for a given column, e.g. training compute or dataset size. This is particularly important to note in cases where such information isn’t obvious. This field is unstructured text."
        source_field: "Notes fields, e.g. “Training compute notes”"
      "Confidence":
        type: string
        description: "Metadata describing our confidence in the recorded values for Training compute, Parameters, and Training dataset size. This describes confidence for the most uncertain of these parameters, where they have a non-empty entry (compute is typically the most uncertain). The confidence statuses are defined as followed: Confident: This is based on primary or reliable sources who are providing specific technical details that allow us to make this estimate using a methodology we are confident is correct. If a lab discloses in a technical paper that a model was trained on 30,000 H100s for 45 days, we would make a confident estimate. Deepseek v3 is in this category. Likely: Similar to confident in terms of methodology, but the inputs to the methodology are not as reliable. For instance, we might base an estimate of how many GPUs were used for a training run on a detailed leak, a less reliable source (ie, what an engineer discusses on a podcast), the size of a datacenter we are tracking, or a vague but trustworthy source. Grok 3 is in this category, Speculative: Our best guess, based on methodologies or sources we think are informative but don’t have confidence in. For instance, we might base an estimate on the compute used to train other models with similar capabilities. Speculative estimates may change substantially as more information comes to light. An example of a speculative estimate would be GPT-4o, where we used benchmark scores to estimate how much compute was required for training. We also provide further statuses: Unknown - we have too little information to even make a speculative estimate. Wrong - we know this estimate is incorrect, and it has been queued for correction Unverified - this estimate has not yet been assessed for confidence."
      "Abstract":
        type: string
        description: "Abstract text from the publication associated with the model."
      "Country (of organization)":
        type: string
        description: "Country/countries associated with the developing organization(s). Multinational is used to mark organizations associated with multiple countries."
      "Base model":
        type: string
        description: "Which base model the model was fine-tuned from, if applicable."
      "Finetune compute (FLOP)":
        type: number
        unit: "FLOP"
        description: "Compute used to fine-tune the model, if applicable."
      "Finetune compute notes":
        type: string
        description: "Metadata documenting the reasoning and/or evidence for a given column, e.g. training compute or dataset size. This is particularly important to note in cases where such information isn’t obvious. This field is unstructured text."
        source_field: "Notes fields, e.g. “Training compute notes”"
      "Hardware quantity":
        type: number
        unit: "chips"
        description: "Indicates the quantity of the hardware used in training, i.e. the number of chips."
      "Hardware utilization (MFU)":
        type: number
        unit: "ratio (0.00-1.00)"
        description: "Number between 0.00 and 1.00 indicating the hardware utilization ratio, i.e. utilized FLOPs / theoretical maximum FLOPs. This value reflects utilization based on computations successfully applied to model training, and does not include computations performed by the hardware which do not ultimately affect the model."
      "Training data center":
        type: string
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
      "Batch size":
        type: number
        description: "Batch size used during training."
      "Batch size notes":
        type: string
        description: "Metadata documenting the reasoning and/or evidence for a given column, e.g. training compute or dataset size. This is particularly important to note in cases where such information isn’t obvious. This field is unstructured text."
        source_field: "Notes fields, e.g. “Training compute notes”"
      "Training chip-hours":
        type: number
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
      "Training code accessibility":
        type: string
        description: "Denotes how the model can be accessed and used by the public. “Open weights (unrestricted)”, “Open weights (restricted use)” and “Open weights (non-commercial)” all mean that the model weights are downloadable by the public, but with different restrictions on use. “API access” means the model can only be interacted with via an application programming interface, and possibly also a hosted service. “Hosted access (no API)” means the model can only be interacted with via a hosted service. “Unreleased” means there is no way for the public to access the model."
        note: "Definition text copied as published on the records page; it describes access to the model rather than to training code."
      "Accessibility notes":
        type: string
        description: "Metadata documenting the reasoning and/or evidence for a given column, e.g. training compute or dataset size. This is particularly important to note in cases where such information isn’t obvious. This field is unstructured text."
        source_field: "Notes fields, e.g. “Training compute notes”"
      "Training compute cost (2023 USD)":
