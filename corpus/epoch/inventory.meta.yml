  corpus/epoch/ai-data-centers/data_center_timelines.csv:
    title: "AI data center timelines"
    description: "Timelines: status and metrics (power, compute, cost, water) of a data center as of a date (Epoch's records section 'Table: Timelines')."
    columns_source: "https://epoch.ai/data/data-centers-documentation/records (section 'Table: Timelines')"
    primary_key: ["Data center", "Date"]
    primary_key_note: "Epoch states no key. Tested with duckdb on the committed file (575 rows): [Data center, Date] 575 distinct, no nulls (unique). Chosen: [Data center, Date]."
    columns:
      "Data center":
        type: string
        description: "Link to the record of the data center this timeline corresponds to."
      "Date":
        type: date
        unit: "YYYY-MM-DD"
        description: "As-of date for the status/metrics."
      "Construction status":
        type: string
        description: "Short description of the construction status at that point in time."
      "Buildings operational":
        type: number
        description: "Count of buildings operational by this date."
      "IT power (MW)":
        type: number
        unit: "MW"
        description: "Total IT power capacity in megawatts, including power for GPU servers, network infrastructure and storage."
      "Power (MW)":
        type: number
        unit: "MW"
        description: "Total facility power capacity in megawatts, including the IT power and power for cooling, lighting, etc."
      "H100 equivalents":
        type: number
        unit: "H100e"
        description: "The number of NVIDIA H100 GPUs that are equivalent to this data center’s compute capacity, based on 8-bit OP/s."
      "Performance (8-bit OP/s)":
        type: number
        unit: "OP/s"
        description: "Maximum compute capacity in any format 8 bits or wider. Estimates usually based on best guesses of what chips would be used at the location and the power estimate to infer the number of these chips."
      "Total capital cost (2025 USD billions)":
        type: number
        unit: "2025 USD billions"
        description: "Total capital cost of the entire facility by this date, including IT hardware (such as GPUs), mechanical and electrical equipment, building shell and white space, construction labor, land acquisition, etc."
      "Compute cost (2025 USD billions)":
        type: number
        unit: "2025 USD billions"
        description: "Total capital cost of the IT hardware in the data center buildings. Includes GPUs, networking, server racks, etc."
      "Construction cost (2025 USD billions)":
        type: number
        unit: "2025 USD billions"
        description: "Total of all capital costs other than compute, including building shell and white space, mechanical and electrical, HVAC systems, construction labor, land acquisition, etc."
      "Annual operating cost (2025 USD billions)":
        type: number
        unit: "2025 USD billions"
        description: "Annual total of all operating costs, including energy consumption, taxes, maintenance, labor, and water."
      "Water use (MGD)":
        type: number
        unit: "million gallons/day"
        description: "Estimated average water consumed by the data center in million gallons/day."
      "Current H100 equivalents (from Data center)":
        type: number
        unit: "H100e"
        description: "Lookup to the current number of H100 equivalents for the data center as of today. Used to group and sort the table."
        source_field: "Current H100 equivalents"
  corpus/epoch/ai-data-centers/data_centers.csv:
    title: "AI data centers"
    description: "AI data centers: one row per site or campus, with owners, users, location and current capacity (Epoch's records section 'Table: AI data centers')."
    columns_source: "https://epoch.ai/data/data-centers-documentation/records (section 'Table: AI data centers')"
    primary_key: ["Name"]
    primary_key_note: "Epoch states no key. Tested with duckdb on the committed file (96 rows): [Name] 96 distinct, no nulls (unique). Chosen: [Name], Epoch's 'Name for the site or campus'."
