      "countries":
        type: string
        description: "The countries the posting's location maps to, one per distinct country. Empty when the location could not be mapped."
      "cities":
        type: string
        description: "Country: City pairs for the cities the posting's location maps to; Remote in place of a city for a listing that is remote within the country, Unspecified when it names a country or region but no city. Empty when the location could not be mapped."
      "location_source":
        type: string
        description: "Where the location came from: field when taken from the job board's location field, title or body when inferred from the advert's title or text. Empty when the location could not be mapped."
  corpus/epoch/frontier-lab-hiring/frontier_lab_hiring_revisions.csv:
