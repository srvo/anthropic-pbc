        description: "Epoch: \"HBM cost is already modeled in terms of cost and is taken directly from the model\": \"HBM ($) = (Units × HBM_per_chip_GB × price_per_GB) ÷ packaging_yield\". 95th percentile (P95) of the estimate. Epoch: \"All figures are estimates with 90% confidence intervals (P5 / P95) derived from 10,000 Monte Carlo simulation draws.\""
