  "corpus/epoch/benchmarks/benchmark_metadata.csv":
    title: "Benchmark metadata (ECI benchmark policy table)"
    description: "One row per benchmark: where its scores live, how to normalize them, its release date, whether the ECI fit uses it, and what supersedes it. Covers Epoch's own and external benchmarks."
    columns_source: "https://github.com/epoch-research/eci-public/blob/main/src/eci/dataloader.py (module and function docstrings)"
    primary_key:
    - "benchmark"
    primary_key_note: "Epoch states \"one row per benchmark\" (https://github.com/epoch-research/eci-public/blob/main/src/eci/dataloader.py (module and function docstrings)). Confirmed with duckdb: [benchmark] 91 distinct of 91 rows, 0 null."
    columns:
      "benchmark":
        type: "string"
        description: "One row per benchmark (\"benchmark_metadata.csv: one row per benchmark\")."
      "in_eci":
        type: "boolean"
        description: "\"Rows with in_eci false describe benchmarks the site displays but the fit does not use (they still carry baselines and ceilings).\""
      "source_file":
        type: "string"
        description: "Where the benchmark's scores live: the file in the zip that holds them (\"where its scores live (source_file, score_column, scale)\"). Empty when no file is named."
      "score_column":
        type: "string"
        description: "Where the benchmark's scores live: the column of source_file read as the score (\"where its scores live (source_file, score_column, scale)\")."
      "scale":
        type: "number"
        description: null
        description_reason: "unknown: not defined in Epoch's documentation"
      "random_baseline":
        type: "number"
        description: "Normalization input: the benchmark's random-guessing baseline, which maps to 0 (\"Normalize raw scores so each benchmark's random-guessing baseline maps to 0 and its max-achievable score (the ceiling) maps to 1, then clip into [0, 1]\")."
      "score_ceiling":
        type: "number"
        description: "Normalization input: the benchmark's max-achievable score (the ceiling), which maps to 1 (same docstring as random_baseline)."
      "release_date":
        type: "date"
        unit: "YYYY-MM-DD"
        description: "The benchmark's release date (\"its release_date\")."
      "superseded_by":
