      "CoWoS share (%) (5th percentile)":
        type: number
        unit: "%"
        description: "Share of global CoWoS supply. Epoch: \"We then calculate the share of supply by dividing component demand by component supply.\" 5th percentile (P5) of the estimate. Epoch: \"All figures are estimates with 90% confidence intervals (P5 / P95) derived from 10,000 Monte Carlo simulation draws.\""
      "CoWoS share (%) (median)":
        type: number
        unit: "%"
        description: "Share of global CoWoS supply. Epoch: \"We then calculate the share of supply by dividing component demand by component supply.\" Median of the estimate (Epoch's Monte Carlo model, 10,000 draws)."
      "CoWoS share (%) (95th percentile)":
        type: number
        unit: "%"
        description: "Share of global CoWoS supply. Epoch: \"We then calculate the share of supply by dividing component demand by component supply.\" 95th percentile (P95) of the estimate. Epoch: \"All figures are estimates with 90% confidence intervals (P5 / P95) derived from 10,000 Monte Carlo simulation draws.\""
      "HBM cost (USD) (5th percentile)":
