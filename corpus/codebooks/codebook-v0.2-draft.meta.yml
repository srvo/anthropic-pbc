producer: Sloane Ortel (this repository; personal working paper)
title: AI-risk codebook v0.2 DRAFT
description: >-
  Thirty natural-language NLI hypotheses: the 16 of codebook v0.1 word for
  word (status "v0.1 unchanged"), plus 14 new risk dimensions read from the
  section headings of English Wikipedia's AI-risk hub articles (status
  "v0.2 DRAFT new"). Each new row cites the heading and revision it came
  from in `source`. The wording of the new rows is a draft awaiting human
  review (OPENQUESTIONS Q2). The `democracy` row comes from Sloane's
  health-of-democracy question, with the nearest heading cited.
