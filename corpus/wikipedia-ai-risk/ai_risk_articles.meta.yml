# Metadata for data://meadow/wikipedia/2026-11-04/ai_risk_articles (schema/metadata.schema.yml)
title: English Wikipedia AI-risk articles as anchored paragraphs and windows, pinned 2026-11-04
description: >-
  What English Wikipedia files under AI risk, as a reference map: 151 pinned
  articles converted to plain Markdown by published rules, stored verbatim as
  paragraphs and scoring windows with character offsets and BLAKE3 hashes, an
  inventory of every section, and a candidate list of dimensions read from the
  headings of four hub articles. The dimension list is a candidate for human
  review, not a taxonomy or a codebook.
processing: >-
  Parse each pinned wikitext with mwparserfromhell 0.7.2 and render plain
  Markdown: headings kept as # lines (the lead is "(lead)"); templates,
  references, tables, galleries, maths and files dropped, except a short
  allowlist of inline templates whose argument is prose; links reduced to
  their label; category, file and interlanguage links and bare URLs dropped;
  list items become "- " lines; bold and italic markup removed; standard
  end-matter sections (References, Notes, See also, External links, Further
  reading and variants) dropped with their subsections; whitespace and
  emptied parentheses collapsed. A paragraph is a run of non-blank lines. A
  window is the whole paragraph up to 1,500 characters, or consecutive chunks
  of whole sentences of at most 1,500 characters; paragraphs under 80
  characters get no window. Candidate dimensions are the kept headings of AI
  safety, Ethics of artificial intelligence and Existential risk from
  artificial intelligence, and the subtree under "Ethics > Risks and harm" of
  Artificial intelligence. Drops dropped templates' words (for example a
  converted unit or a templated date), end-matter text, and the Markdown
  itself, which is rebuilt locally. verify re-converts, re-slices, re-hashes
  and rebuilds every output to compare bytes. No model, no labels.
unit_of_analysis: >-
  one paragraph of a pinned article's converted Markdown (articles.parquet);
  windows.parquet cuts paragraphs of 80 characters or more into scoring windows
denominator: corpus/wikipedia-ai-risk/sections.tsv (every section of every article, including dropped end-matter)
coverage: >-
  151 articles, one revision each, the last at or before 2026-11-04T00:00:00Z
  (revids 1301533223, 2025-07-20, to 1383632719, 2026-11-03). 1,984 sections,
  3,761 paragraphs, 3,749 windows, 110 candidate headings. 78 paragraphs are
  under 80 characters and get no window. Category membership was read on the
  day pin ran. The seed article "AI-assisted targeting" does not exist and was
  dropped.
does_not_answer:
  - "How likely or harmful a risk is: Wikipedia records editor attention, not risk. A heading exists because editors wrote one; its size measures how much they wrote."
  - "Risks felt most outside North America and Europe: English Wikipedia's editors skew towards them, so labelling work, data-centre siting and surveillance in other legal systems can be thin or absent."
  - "Anything after the pin: the pin is one day's text, and articles on fast-moving subjects are rewritten often."
  - "Which articles are about risk: category membership mixes risks with the organisations, books and fiction about them, and some relevant articles are in no seed category."
  - "That an absent risk is unimportant: silence is not absence."
  - "Any model judgment: scoring windows against the codebook is a separate, witnessed step under bert-enrichment-spec.md §5."
