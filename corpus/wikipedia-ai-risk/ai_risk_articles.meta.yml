  name: Creative Commons Attribution-ShareAlike 4.0 International (CC BY-SA 4.0), adapted from English Wikipedia
  url: https://creativecommons.org/licenses/by-sa/4.0/
status: held
tables:
  corpus/wikipedia-ai-risk/articles.parquet:
    title: "Paragraphs of every article, verbatim from the converted Markdown"
    description: "One row per paragraph of a kept section, anchored in the article's Markdown."
    primary_key: [title, paragraph_number]
    columns:
      "title":
        type: string
        description: "Article title (MANIFEST.tsv title)."
      "pageid":
        type: integer
        description: "MediaWiki page id."
      "revid":
        type: integer
        description: "Pinned revision id."
      "section_path":
        type: string
        description: "Heading path of the paragraph's section, headings joined by ' > '; '(lead)' for the lead."
      "heading_level":
        type: integer
        description: "Wikitext heading level of the section (2 for ==); 1 for the lead."
      "paragraph_number":
        type: integer
        description: "1-based order of the paragraph within the article, across kept sections."
      "kind":
        type: string
        description: "Paragraph kind."
        values:
          list: "text starts with '- ' (a list)"
          prose: "anything else"
      "md_start":
        type: integer
        unit: characters
        description: "Start offset (0-based, inclusive) of the paragraph in the article's converted Markdown."
      "md_end":
        type: integer
        unit: characters
        description: "End offset (exclusive) of the paragraph in the article's converted Markdown."
      "markdown_blake3":
        type: string
        hash_of: "the article's whole converted Markdown, UTF-8"
        description: "BLAKE3 of the converted Markdown the offsets refer to."
      "paragraph_blake3":
        type: string
        hash_of: "the paragraph text, UTF-8"
        description: "BLAKE3 of `text`."
      "text":
        type: string
        verbatim: true
        description: "The paragraph, Markdown [md_start, md_end)."
  corpus/wikipedia-ai-risk/sections.tsv:
    title: "Every section of every article"
    description: "Denominator. Includes dropped end-matter, with kept = 0."
    primary_key: [title, section_index]
    columns:
      "title":
        type: string
        description: "Article title."
      "revid":
        type: integer
        description: "Pinned revision id."
      "section_index":
        type: integer
        description: "0-based order of the section in the article; 0 is the lead."
      "heading_level":
        type: integer
        description: "Wikitext heading level (2 for ==); 1 for the lead."
      "heading_path":
        type: string
        verbatim: true
        description: "Headings from the top down, joined by ' > '; '(lead)' for the lead."
      "kept":
        type: integer
        description: "Whether the section's text is in the corpus."
        values:
          "1": "kept"
          "0": "end-matter heading, or under one; text dropped"
      "n_paragraphs":
        type: integer
        unit: paragraphs
        description: "Paragraphs stored from the section; 0 when kept = 0."
      "n_chars":
        type: integer
        unit: characters
        description: "Total characters of those paragraphs."
  corpus/wikipedia-ai-risk/windows.parquet:
    title: "Scoring windows"
    description: "One row per window, in the shape of corpus/earnings-calls/ai-windows.parquet."
    primary_key: [window_id]
    columns:
      "window_id":
        type: string
        hash_of: "the string <title>|<revid>|<paragraph_number>|<start_char>|<end_char>|<paragraph_blake3>"
        description: "First 16 hex characters of the BLAKE3 hash of the window's anchors."
      "title":
        type: string
        description: "Article title."
      "pageid":
        type: integer
        description: "MediaWiki page id."
      "revid":
        type: integer
        description: "Pinned revision id."
      "section_path":
        type: string
        description: "Heading path of the section, as in articles.parquet."
      "paragraph_number":
        type: integer
        description: "Paragraph the window is cut from (articles.parquet paragraph_number)."
      "paragraph_blake3":
        type: string
        hash_of: "the paragraph text, UTF-8"
        description: "BLAKE3 of the source paragraph."
      "start_char":
        type: integer
        unit: characters
        description: "Start offset (0-based, inclusive) of the window in the paragraph text."
      "end_char":
        type: integer
        unit: characters
        description: "End offset (exclusive) of the window in the paragraph text."
      "window_blake3":
        type: string
        hash_of: "the window text, UTF-8"
        description: "BLAKE3 of `text`."
      "text":
        type: string
        verbatim: true
        description: "The window, paragraph [start_char, end_char)."
  corpus/wikipedia-ai-risk/dimensions-candidate.tsv:
    title: "Candidate dimensions from hub-article headings"
    description: "Candidate for human review, not a taxonomy. One row per kept heading of the hub sections; every row is 'candidate: not reviewed'."
    primary_key: [source_title, heading_path]
    columns:
      "source_title":
        type: string
        description: "Hub article (HUBS in scripts/wp_extract.py)."
      "revid":
        type: integer
        description: "Pinned revision id of the hub article."
      "heading_level":
        type: integer
        description: "Wikitext heading level (2 for ==)."
      "heading_path":
        type: string
        verbatim: true
        description: "Headings from the top down, joined by ' > '."
      "heading":
        type: string
        verbatim: true
        description: "The section's own heading."
      "main_articles":
        type: string
        description: "' | '-joined targets of the section's {{Main}}, {{Further}}, {{Details}}, {{See also}} and similar hatnotes, deduplicated in order; empty if none."
      "linked_articles":
        type: string
        description: "' | '-joined targets of every article link in the section's own text (not its subsections), deduplicated in order."
      "n_linked_in_corpus":
        type: integer
        unit: articles
        description: "Distinct main and linked targets whose title is a title in MANIFEST.tsv (exact match; redirects not followed)."
      "codebook_v0_1_literal_match":
        type: string
        description: "Comma-separated codebook-v0.1 ids that, with underscores as spaces, appear as a whole word in the lower-cased heading; empty if none. Literal, not semantic."
      "status":
        type: string
        description: "Review status."
        values:
          "candidate: not reviewed": "every row; choosing dimensions is Sloane's decision"
