# Metadata for snapshot://defeatbeta/2026-11-04/stock_earning_call_transcripts (praxis/datasets/metadata.schema.yml)
producer: defeatbeta (defeatbeta/yahoo-finance-data on Hugging Face)
title: defeatbeta/yahoo-finance-data, table stock_earning_call_transcripts, dataset commit 31ee0261
description: >-
  Earnings-call transcripts as one parquet file: one row per call (symbol,
  fiscal_year, fiscal_quarter, report_date) with a list of paragraphs
  (paragraph_number, speaker, content). The full table holds 240,536 calls
  across 6,592 tickers, fiscal 2005-2027. The file is 2,294,997,554 bytes and
  lives only in the gitignored .eccorpus/; the repository commits its pin, not
  its bytes.
citation_full: >-
  defeatbeta, yahoo-finance-data (Hugging Face dataset), table
