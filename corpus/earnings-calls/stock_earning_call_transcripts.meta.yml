terms_notes: >-
  The dataset states its transcripts are sourced from Yahoo Finance
  earnings-call pages and are intended for research and educational purposes.
  The words are the speakers'. This repository republishes only AI-mentioning
  paragraphs, windows and questions, for research (corpus/earnings-calls/README.md).
  "S&P 500" is a trademark of S&P Dow Jones Indices LLC; the corpus is not
  affiliated with or endorsed by it.
refetch: exact
refetch_reason: >-
  The download URL resolves a fixed dataset commit. `ec_extract.py fetch` checks
  the file's size and BLAKE3 against MANIFEST.tsv and fails on any mismatch; the
  MANIFEST note records that its SHA-256 equals the Git LFS object id Hugging
  Face publishes. Exact for as long as Hugging Face serves that commit.
personal_data: verbatim_public_figures
personal_data_note: >-
  Speaker names and verbatim words of issuer executives, sell-side analysts and
  call operators speaking on the record. Committed files carry speaker names and
  verbatim text only for AI-mentioning paragraphs, windows and questions.
files: corpus/earnings-calls/MANIFEST.tsv
tables:
  corpus/earnings-calls/MANIFEST.tsv:
    title: "Earnings-call corpus pins"
    description: "One row per pinned upstream input: the transcript parquet and the Wikipedia revision defining the universe."
    primary_key: [id]
    columns:
      "id":
        type: string
        description: "Pin name read by scripts/ec_extract.py: transcripts or sp500."
        values:
          transcripts: "The source transcript parquet."
          sp500: "The Wikipedia revision whose constituents table defines the universe."
      "role":
        type: string
        description: "What the pin is for: source (transcripts) or universe (S&P 500 list)."
      "pinned":
        type: date
        unit: YYYY-MM-DD
        description: "Date the pin was recorded."
      "url":
        type: string
        description: "URL `fetch` (transcripts) or `constituents` (sp500) downloads; both name a fixed commit or revision id."
      "path":
        type: string
        description: "File name: under .eccorpus/ for transcripts; for sp500, the derived TSV in this folder."
      "bytes":
        type: integer
        unit: bytes
        description: "Size checked on fetch: of the parquet file (transcripts) or of the revision wikitext (sp500)."
      "blake3":
        type: string
        description: "BLAKE3 hex digest checked on fetch."
        hash_of: "the parquet file bytes (transcripts); the revision wikitext as UTF-8 (sp500)"
      "note":
        type: string
        description: "Free text: source commit or revision, SHA-256 (transcripts), licence."
