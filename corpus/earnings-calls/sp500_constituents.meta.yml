producer: Wikipedia contributors (English Wikipedia)
title: S&P 500 constituents from Wikipedia "List of S&P 500 companies", revision 1382178819
description: >-
  The constituents table of English Wikipedia's "List of S&P 500 companies" at
  revision 1382178819 (2026-10-27T02:50:28Z): 503 ticker symbols, each with a
  10-digit SEC CIK. It defines the universe of the earnings-call corpus. It is
  the index on that date, applied to every earlier year.
