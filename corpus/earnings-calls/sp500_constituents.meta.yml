    columns:
      "symbol":
        type: string
        description: "Ticker from the row's NyseSymbol, NasdaqSymbol, BZX link or Cboe ticker template, upper-cased, with '.' replaced by '-' (BRK.B -> BRK-B)."
      "cik":
        type: string
        description: "SEC Central Index Key, 10 digits with leading zeros, from the same row; empty if none is found (none empty in this revision)."
