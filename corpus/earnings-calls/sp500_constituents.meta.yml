refetch: exact
refetch_reason: >-
  The API URL names one revision id. `ec_extract.py constituents` refetches it,
  checks the wikitext's BLAKE3 against MANIFEST.tsv, and fails on a mismatch;
  the TSV is then parsed from that wikitext by fixed regexes, so it rebuilds
  byte for byte.
