producer: Sloane Ortell (this repository; personal working paper)
title: Earnings-call AI codebook v0.1
description: >-
  Sixteen hand-written natural-language hypotheses that the NLI witnesses score
  against every AI window: about_ai (topic); ai_risk and ai_opportunity
  (stance); 12 AI risk types (risk_type); and governance (mechanism), which
  marks a described control mechanism and is the hook into the Risk-Governance
  Index. Authored in this repository; the gold-set coder shows the same text
  to human coders as label definitions.
