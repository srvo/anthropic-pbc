name: risk-factor-metadata
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Determinism, metadata drift and incomplete manifests
        run: uv run scripts/test_rf_manifest.py
