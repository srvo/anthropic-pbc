<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">F0001 · Who gets checked</title>
  <desc id="d">Woodcache PBC: worst case, the good things do not happen; checked by Puro.earth verification end to end and by Colorado landfill regulation. Anthropic PBC: worst case, the serious risks it discloses itself in its S-1 risk factors; checked by its own Public Benefit Report, which its own trust says largely describes inputs.</desc>
  <!-- praxis:figure/anthropic-pbc/F0001. Hand-written; every box restates a claim in the paper. -->
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555555"/>
    </marker>
  </defs>

  <g font-size="15" font-weight="700" fill="#111111" text-anchor="middle">
    <text x="165" y="28">Woodcache PBC</text>
    <text x="475" y="28">Anthropic PBC</text>
  </g>

  <g fill="#f4f4f4" stroke="#999999" stroke-width="1">
    <rect x="20" y="44" width="290" height="80" rx="6"/>
    <rect x="330" y="44" width="290" height="80" rx="6"/>
    <rect x="20" y="180" width="290" height="100" rx="6"/>
    <rect x="330" y="180" width="290" height="100" rx="6"/>
  </g>

  <g stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="165" y1="126" x2="165" y2="176"/>
    <line x1="475" y1="126" x2="475" y2="176"/>
  </g>

  <g font-size="11" fill="#555555" text-anchor="middle" font-weight="700" letter-spacing="0.5">
    <text x="165" y="66">WORST CASE</text>
    <text x="475" y="66">WORST CASE</text>
    <text x="165" y="202">CHECKED BY</text>
    <text x="475" y="202">CHECKED BY</text>
  </g>

  <g font-size="13" fill="#111111" text-anchor="middle">
    <text x="165" y="92">The good things</text>
    <text x="165" y="110">do not happen</text>

    <text x="475" y="92">The serious risks it discloses</text>
    <text x="475" y="110">itself (S-1 risk factors)</text>

    <text x="165" y="228">Puro.earth verification,</text>
    <text x="165" y="246">end to end</text>
    <text x="165" y="264">and Colorado landfill regulation</text>

    <text x="475" y="228">Its own Public Benefit Report,</text>
    <text x="475" y="246">which its own trust says</text>
    <text x="475" y="264">largely describes inputs</text>
  </g>
</svg>
