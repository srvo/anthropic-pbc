# Metadata for data://witness/hacker_news/2026-08-31/report (praxis/datasets/metadata.schema.yml)
title: "Hacker News witness report: agreement, AI-risk share by month, and the 12-month risk-type ranking"
description: >-
  Reports built from the two witnesses' scores on the anthropic and
  ai_security sets: per-hypothesis agreement between the witnesses, monthly
  counts and shares of comments proposed as AI risk, the trailing-12-month
  ranking of risk types set beside the earnings-call ranking, and item ids
  (no text) of the most confidently risk-typed comments. Witness proposals,
  no gold set.
processing: >-
  scripts/hn_report.py joins the DeBERTa and ModernBERT scores on (window_id,
  hypothesis_id) for each set. A window is a proposed positive for a
  hypothesis when both witnesses score >= 0.5. A comment carries a hypothesis
  if any of its windows in the set does. agreement.tsv works at window level;
  by-month.tsv at comment level against months.tsv; risk-ranking-ttm.tsv
  counts, for 2025-09-01 to 2026-08-31, comments proposed both ai_risk and a
  risk type, as a share of comments proposed ai_risk, and copies the
  earnings-call column from
  proposals/earnings-calls/codebook-v0.1/report/risk-ranking-ttm.tsv.
  examples-ttm.tsv keeps, per set and risk type, the 10 comments with the
  highest min(DeBERTa, ModernBERT) score among windows also proposed ai_risk,
  in the same 12 months. No comment text or username is written; examples are
  item ids with their HN URL.
unit_of_analysis: >-
  one comment (a comment carries a hypothesis if any of its windows does);
  one window in agreement.tsv
denominator: >-
  corpus/hacker-news/months.tsv (n_comments, every live comment per month);
  for agreement.tsv, the windows of each set in corpus/hacker-news/windows.parquet
coverage: >-
  Comments 2021-01 to 2026-08 (by-month.tsv, agreement.tsv); the ranking and
  examples cover 2025-09-01 to 2026-08-31, the archive's last 12 months, while
  the earnings-call column covers the 12 months to 2026-11-04. Comment months
  in by-month.tsv come from windows.parquet `day`, a UTC date, and so agree
  with the UTC source-file months that months.tsv counts.
does_not_answer:
  - "What the public thinks: HN is a self-selected, English-language audience of developers and practitioners, many of whom build on or compete with these products. It does not fill the gap of workers, users and data-center neighbours."
  - "What a hypothesis about 'the company' means on a comment: the codebook was written for company speech, so governance and disruption read differently here than on calls."
  - "Any rate before a hand-coded sample checks it: informal text (sarcasm, quotation, argument) is harder for zero-shot NLI, and there is no gold set."
  - "How salient a topic is: mention is volume, not salience. A month with a product launch has more Anthropic comments; rates are reported against all comments that month."
