      "executives_pct": {type: float, unit: percent, description: "Share of executive AI-risk windows naming the type; empty on the denominator row."}
      "executives_n": {type: integer, unit: units, description: "Executive windows positive on ai_risk and the type; the denominator on the ai_risk_units row."}
      "analysts_pct": {type: float, unit: percent, description: "Share of analyst AI-risk questions naming the type; empty on the denominator row."}
      "analysts_n": {type: integer, unit: units, description: "Analyst questions positive on ai_risk and the type; the denominator on the ai_risk_units row."}
      "hn_anthropic_pct": {type: float, unit: percent, description: "Share of HN Anthropic AI-risk windows naming the type; empty on the denominator row."}
      "hn_anthropic_n": {type: integer, unit: units, description: "HN Anthropic windows positive on ai_risk and the type; the denominator on the ai_risk_units row."}
      "hn_security_pct": {type: float, unit: percent, description: "Share of HN AI-security AI-risk windows naming the type; empty on the denominator row."}
      "hn_security_n": {type: integer, unit: units, description: "HN AI-security windows positive on ai_risk and the type; the denominator on the ai_risk_units row."}
      "wikipedia_pct": {type: float, unit: percent, description: "Share of Wikipedia AI-risk windows naming the type; empty on the denominator row."}
      "wikipedia_n": {type: integer, unit: units, description: "Wikipedia windows positive on ai_risk and the type; the denominator on the ai_risk_units row."}
