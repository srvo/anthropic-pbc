# Metadata for data://witness/cross_source/2026-11-04/dialogue_space_v0_2_draft (praxis/datasets/metadata.schema.yml)
title: "[DRAFT v0.2] Dialogue space: share of each source's AI-risk units naming each risk type"
description: >-
  For five sources, the share of units that both witnesses propose as
  ai_risk which both witnesses also propose as each risk type of codebook
  v0.2-draft. Built by scripts/v02_map.py. Witness proposals, not findings.
processing: >-
  For each source, join the two witnesses' v0.2-draft scores on (unit id,
  hypothesis_id) and mark a hypothesis positive when both are >= 0.5. Restrict
  units by source and period: executives are earnings-call windows whose role
  is not analyst_heuristic or operator, report_date after 2025-11-04 through
  2026-11-04; analysts are AI questions in the same period; HN sets are
  windows with day 2025-09-01 to 2026-08-31; Wikipedia is every window. For
  each risk_type, count units positive on both ai_risk and the type, divided
  by units positive on ai_risk. Rows are sorted by each type's largest share
  in any source. The chart draws the same numbers.
unit_of_analysis: one unit of a source (window or question) proposed as ai_risk
denominator: >-
  The ai_risk_units row of dialogue-space.tsv: 179 executive windows, 64
  analyst questions, 6,281 HN Anthropic windows, 3,096 HN AI-security windows,
  833 Wikipedia windows.
coverage: >-
  Calls and questions: 12 months to 2026-11-04 (S&P 500 as of 2026-10-27,
  survivorship-biased). HN: 2025-09 to 2026-08 (the archive ends August 2026).
  Wikipedia: 151 articles at revisions as of 2026-11-04.
codebook_status_note: >-
  DRAFT codebook: the 14 new hypotheses' wording awaits human review, and
  bio_chem fails on Wikipedia's own Biosecurity section (spec §10,
  2026-11-04). bf16 scores are not invariant to batch composition (spec §10).
does_not_answer:
  - "How precise any cell is: there is no gold set, and the executive and analyst denominators are small (179 and 64), so their single-digit cells rest on a handful of units."
  - "Which risks matter or materialised: a share of talk measures attention, not risk."
  - "What the public thinks: HN is a self-selected practitioner audience and Wikipedia records editor attention."
  - "Whether a zero is silence or a wording failure: bio_chem shows a hypothesis can fail where the topic is plainly present."
license:
  name: >-
    Most restrictive of the sources: CC BY-SA 4.0 (Wikipedia); ODC-BY 1.0
    (HN, transcripts). Counts and shares only; no text.
  url: https://creativecommons.org/licenses/by-sa/4.0/
status: witness
proposal_only: true
