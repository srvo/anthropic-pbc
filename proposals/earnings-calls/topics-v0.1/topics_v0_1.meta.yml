    description: "One row per window, sorted by window_id."
    primary_key: [window_id]
    columns:
      "window_id":
        type: string
        description: "Window id; joins to corpus/earnings-calls/ai-windows.parquet."
      "topic":
        type: integer
        description: "BERTopic topic number, 0-92; -1 = unclustered (HDBSCAN noise)."
  proposals/earnings-calls/topics-v0.1/topics.tsv:
