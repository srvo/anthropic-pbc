        type: integer
        description: "Fiscal year as labelled by the source."
      "risk_windows":
        type: integer
        unit: windows
        description: "Windows proposed as about_ai and ai_risk."
      "regulation": {type: integer, unit: windows, description: "Risk windows also proposed as regulation (both witnesses >= 0.5)."}
      "cyber": {type: integer, unit: windows, description: "Risk windows also proposed as cyber."}
      "privacy": {type: integer, unit: windows, description: "Risk windows also proposed as privacy."}
      "accuracy": {type: integer, unit: windows, description: "Risk windows also proposed as accuracy."}
      "bias": {type: integer, unit: windows, description: "Risk windows also proposed as bias."}
      "labor": {type: integer, unit: windows, description: "Risk windows also proposed as labor."}
      "disruption": {type: integer, unit: windows, description: "Risk windows also proposed as disruption."}
      "capex": {type: integer, unit: windows, description: "Risk windows also proposed as capex."}
      "energy": {type: integer, unit: windows, description: "Risk windows also proposed as energy."}
      "supply": {type: integer, unit: windows, description: "Risk windows also proposed as supply."}
      "ip": {type: integer, unit: windows, description: "Risk windows also proposed as ip."}
      "safety_ethics": {type: integer, unit: windows, description: "Risk windows also proposed as safety_ethics."}
  proposals/earnings-calls/codebook-v0.1/report/by-role.tsv:
    title: "AI, risk and opportunity windows by heuristic speaker role"
    description: "One row per heuristic role (analyst_heuristic, issuer_heuristic, operator)."
    primary_key: [role]
    columns:
      "role":
        type: string
        description: "Heuristic role from ai-windows.parquet; a name-frequency heuristic, not fact."
      "windows_ai":
        type: integer
        unit: windows
        description: "Windows proposed as about_ai."
      "windows_risk":
        type: integer
        unit: windows
        description: "Windows proposed as about_ai and ai_risk."
      "windows_opportunity":
        type: integer
        unit: windows
        description: "Windows proposed as about_ai and ai_opportunity."
      "share_risk":
        type: float
        unit: fraction (0-1)
