# Metadata for data://witness/earnings_calls/2026-11-04/ai_risk_series (praxis/datasets/metadata.schema.yml)
title: AI as a risk on S&P 500 earnings calls, by year and over the trailing 12 months
description: >-
  Two measures side by side, because neither is clean alone: a lexical one (an
  AI window containing the word "risk") and a witness one (both NLI witnesses
  propose ai_risk). The share of calls per calendar year carrying each, a
  ranking of AI risk types by firms over the trailing 12 months, every counted
  window quoted, and two charts. The citable claim is the shape the two
  measures share, not either level.
processing: >-
  as_of defaults to the latest report_date in calls.tsv (2026-11-04 in this
  build), so no clock enters. Calls are the unique, non-stub calls of
  calls.tsv with report_date <= as_of. A window is lexical when its text
  matches (?i)\brisk(s|y|ier|iest)?\b; its witness flags come from
  report/window-flags.tsv. A call counts for a measure when any of its windows
  does. The series keeps calendar years of report_date from 2013. The ranking
  takes windows with report_date in (as_of - 1 year, as_of] flagged ai_risk by
  both witnesses, and per risk type counts distinct firms and windows also
  flagged with that type; it sorts by firms, then windows, then type id. The
  witness measure here uses the ai_risk flag alone, not about_ai and ai_risk
  as in report/by-year.tsv. Charts are SVG from matplotlib with a fixed hash
  salt and no date metadata.
unit_of_analysis: one call (series); one firm per risk type (ranking); one window (quotes)
denominator: >-
  corpus/earnings-calls/calls.tsv (unique, non-stub calls with report_date <= as_of; the
  calls column of ai-risk-by-year.tsv)
coverage: >-
  Calendar years 2013 to 2026; 2026 runs to 2026-11-04. Trailing 12 months to
  2026-11-04: 496 firms held calls; 137 had at least one window proposed as
  ai_risk by both witnesses (379 windows). Universe and survivorship bias as in
  the ai_windows step.
does_not_answer:
  - "Whether the witness level is right: no human gold set has been coded, so witness precision is unknown and no rate is citable until a stratified hand-coded sample reports precision and recall (method doc §7)."
  - "Whether a risk said on a call is an exposure, was governed, or materialised: a mention is not an exposure and an exposure is not a loss (§7)."
  - "Anything about firms whose calls are silent on AI risk: silence is counted against the denominator, not read as absence of risk (§7)."
  - "What workers, users or data-center neighbours would say: they do not speak on calls (§7)."
license:
