    license: Apache-2.0
codebook: corpus/earnings-calls/codebook-v0.1.tsv
tables:
  proposals/earnings-calls/codebook-v0.1/report/ai-risk-by-year.tsv:
    title: "Share of calls with AI as a risk, by calendar year"
    description: "One row per calendar year of report_date from 2013; a leading # line states as_of and the denominator."
    primary_key: [year]
    columns:
      "year":
        type: integer
        description: "Calendar year of the call's report_date."
      "calls":
        type: integer
        unit: calls
        description: "Unique, non-stub S&P 500 calls in the year, up to as_of."
      "calls_lexical":
        type: integer
        unit: calls
        description: "Calls with at least one AI window whose text contains risk, risks, risky, riskier or riskiest (case-insensitive)."
      "calls_witnesses":
        type: integer
        unit: calls
        description: "Calls with at least one window both witnesses score >= 0.5 on ai_risk."
      "pct_lexical":
        type: float
        unit: percent
        description: "100 * calls_lexical / calls, rounded to 2 decimals."
      "pct_witnesses":
        type: float
        unit: percent
        description: "100 * calls_witnesses / calls, rounded to 2 decimals."
  proposals/earnings-calls/codebook-v0.1/report/ai-risk-by-year.svg:
    title: "Chart: share of S&P 500 calls where AI is discussed as a risk"
    description: "Line chart of pct_lexical and pct_witnesses by year from ai-risk-by-year.tsv, last values labelled."
  proposals/earnings-calls/codebook-v0.1/report/risk-ranking-ttm.tsv:
    title: "AI risk types ranked by firms, trailing 12 months"
    description: "One row per risk type (12); a leading # line states the window, firms holding calls, and firms and windows proposed as ai_risk."
    primary_key: [risk_type]
    columns:
      "rank":
        type: integer
        description: "1-based rank by firms descending, then windows descending, then risk_type."
      "risk_type":
        type: string
        description: "Risk-type hypothesis id from codebook-v0.1.tsv."
      "label":
        type: string
        description: "Display label for the risk type (LABELS in scripts/ec_risk_series.py)."
      "firms":
        type: integer
        unit: firms
        description: "Distinct symbols with at least one window in the 12 months both witnesses flag as ai_risk and as this type."
      "windows":
        type: integer
        unit: windows
        description: "Windows in the 12 months flagged as ai_risk and as this type by both witnesses."
  proposals/earnings-calls/codebook-v0.1/report/risk-ranking-ttm.svg:
    title: "Chart: AI risks raised on S&P 500 calls, trailing 12 months"
    description: "Horizontal bar chart of firms per risk type from risk-ranking-ttm.tsv, types with at least one firm."
  proposals/earnings-calls/codebook-v0.1/report/risk-quotes-ttm.tsv:
    title: "Every window counted in the 12-month ranking, quoted"
    description: "One row per window in the trailing 12 months flagged ai_risk by both witnesses, sorted by report_date descending, symbol, window_id."
    primary_key: [window_id]
    columns:
      "report_date":
        type: date
        unit: YYYY-MM-DD
        description: "Call report date."
      "symbol":
        type: string
        description: "Ticker."
      "speaker":
        type: string
        description: "Speaker string as in the source."
        verbatim: true
      "role":
        type: string
        description: "Heuristic speaker role (operator, analyst_heuristic, issuer_heuristic)."
      "risk_types":
        type: string
        description: "Semicolon-separated risk types both witnesses flag for the window, in TYPES order; empty when none (160 of 379 rows)."
      "window_id":
        type: string
        description: "Window id; joins to corpus/earnings-calls/ai-windows.parquet."
      "quote":
        type: string
        description: "The window text with newlines and tabs replaced by spaces; no window in this build contains either, so it equals the verbatim text."
        verbatim: true
