# Metadata for data://witness/earnings_calls/2026-11-04/codebook_v0_2_draft (schema/metadata.schema.yml)
title: "[DRAFT v0.2] NLI witness scores for every AI window against codebook v0.2-draft"
description: >-
  Two zero-shot NLI cross-encoders of different architecture, DeBERTa-v3-large
  and ModernBERT-large, each score every AI window against all 30 hypotheses of
  codebook v0.2-draft. Score = P(entailment). Proposals under
  docs/bert-enrichment-spec.md §5, never verdicts.
processing: >-
  Each window's text (premise) is paired with each hypothesis in
  codebook-v0.2-draft.tsv; the model's softmax probability for its entailment label
  is the score. Inputs are truncated to 512 tokens, cutting the window, never
  the hypothesis (truncation only_first). Both runs used Modal L40S GPUs in
  bfloat16, batch 128 (run-*.json; scripts/ec_classify_modal.py calling
  ec_classify.py's functions). Windows are scored in shards of 2,048, tagged by
  model, dtype, backend and the first 12 hex of the window-file and codebook
  BLAKE3; the merge refuses unless every window x hypothesis pair is present
  exactly once. Shard scores are written to 6 decimals and stored as FLOAT.
  Nothing is trained and no label comes from an LLM. Drops nothing: every
  window gets every hypothesis.
unit_of_analysis: one (window, hypothesis) pair, scored once per witness
denominator: >-
  corpus/earnings-calls/ai-windows.parquet (every window is scored; 38,600 windows x 30
  hypotheses = 1,158,000 pairs per witness)
coverage: >-
  All 38,600 windows of ai-windows.parquet (BLAKE3 recorded as windows_blake3 in
  run-*.json) against all 30 hypotheses of codebook v0.2-draft. On a 200-window check
  of bfloat16 against float32 (on MPS), the mean absolute difference was
  0.0013, the maximum 0.036, and 5 of 3,200 scores (0.16%) crossed 0.5 (method
  doc §5).
codebook_status_note: >-
  DRAFT codebook: the 14 new hypotheses' wording awaits human review (OPENQUESTIONS Q2), and bio_chem is known to fail on Wikipedia's own Biosecurity section (spec §10, 2026-11-04). bf16 scores are not invariant to batch composition: re-scoring the 16 v0.1 hypotheses in this 30-hypothesis run moved scores by up to 0.26 and flipped 0.04-0.06% of decisions at 0.5 (spec §10).
does_not_answer:
  - "How precise either witness is: no human gold set has been coded for this codebook, so before any rate is cited a stratified hand-coded sample must report precision and recall per hypothesis (method doc §7; spec §7, go criterion a)."
  - "Whether a risk named in a window is an exposure, was governed, or materialised (§7)."
  - "Anything about silence on a call, or about people who do not speak on calls (§7)."
  - "Whether the scores reproduce on other hardware: not claimed (method doc §5; spec §5, Route B)."
