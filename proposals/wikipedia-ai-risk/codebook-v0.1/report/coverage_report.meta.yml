codebook:
  path: corpus/earnings-calls/codebook-v0.1.tsv
  blake3: 16d1c01230a706e9c789eb22ccf7ced9f92906659d12b7800b69d4bf25e950a3
tables:
  proposals/wikipedia-ai-risk/codebook-v0.1/report/hypotheses.tsv:
    title: "Positives per hypothesis"
    description: "Window-level counts of each witness's positives (>= 0.5) and joint positives, ordered by n_both."
    primary_key: [hypothesis]
    columns:
      "hypothesis":
        type: string
        description: "Codebook v0.1 hypothesis id (16 ids; corpus/earnings-calls/codebook-v0.1.tsv)."
      "n_windows":
        type: integer
        unit: windows
        description: "Windows scored by both witnesses."
      "n_deberta":
        type: integer
        unit: windows
        description: "Windows with DeBERTa p_entail >= 0.5."
      "n_modernbert":
        type: integer
        unit: windows
        description: "Windows with ModernBERT p_entail >= 0.5."
      "n_both":
        type: integer
        unit: windows
        description: "Windows with both witnesses >= 0.5 (proposed positives)."
  proposals/wikipedia-ai-risk/codebook-v0.1/report/summary.tsv:
    title: "Overall share of AI-risk windows with no specific risk type"
    description: "A single row."
    primary_key: [windows]
    columns:
      "windows":
        type: integer
        unit: windows
        description: "All windows in windows.parquet."
      "ai_risk_windows":
        type: integer
        unit: windows
        description: "Windows proposed ai_risk by both witnesses."
      "no_specific_type":
        type: integer
        unit: windows
        description: "Of those, windows with none of the 11 specific risk types proposed."
      "pct_no_specific_type":
        type: float
        unit: percent
        description: "100 x no_specific_type / ai_risk_windows, 1 decimal, half up from exact counts (scripts/display.py)."
  proposals/wikipedia-ai-risk/codebook-v0.1/report/untyped-by-article.tsv:
    title: "AI-risk windows with no specific risk type, by article"
    description: "One row per article with at least one window proposed ai_risk, ordered by n_no_specific_type."
    primary_key: [title]
    columns:
      "title":
        type: string
        description: "Article title."
      "n_ai_risk_windows":
        type: integer
        unit: windows
        description: "The article's windows proposed ai_risk by both witnesses."
      "n_no_specific_type":
        type: integer
        unit: windows
        description: "Of those, windows with none of the 11 specific risk types proposed."
      "pct_no_specific_type":
        type: float
        unit: percent
        description: "100 x n_no_specific_type / n_ai_risk_windows, 1 decimal, half up from exact counts (scripts/display.py)."
