# Metadata for data://witness/wikipedia/2026-11-04/coverage_report (praxis/datasets/metadata.schema.yml)
title: "How much of Wikipedia's AI-risk discourse codebook v0.1's risk types can name"
description: >-
  codebook-v0.1 was written for company speech. This report counts the
  Wikipedia AI-risk windows that both witnesses propose as ai_risk but that
  get no specific risk type other than the catch-all safety_ethics, overall
  and by article, plus per-hypothesis positive counts. Witness proposals, no
  gold set.
processing: >-
  scripts/wp_report.py joins the DeBERTa and ModernBERT scores on (window_id,
  hypothesis_id). A window is a proposed positive for a hypothesis when both
  witnesses score >= 0.5. Among windows proposed ai_risk, a window is
  "untyped" when none of the 11 specific risk types (regulation, cyber,
  privacy, accuracy, bias, labor, disruption, capex, energy, supply, ip) is
  proposed; safety_ethics does not count as specific. Articles with no window
  proposed ai_risk do not appear in untyped-by-article.tsv. No text is
  written.
unit_of_analysis: one window of corpus/wikipedia-ai-risk/windows.parquet
denominator: >-
  corpus/wikipedia-ai-risk/windows.parquet (3,749 windows; summary.tsv `windows`);
  shares are of windows proposed ai_risk
coverage: >-
  All 3,749 windows of the 151 articles pinned at 2026-11-04T00:00:00Z; 833
  proposed ai_risk, from 111 articles.
does_not_answer:
  - "How likely or harmful a risk is: Wikipedia records editor attention, not risk. A heading exists because editors wrote one; its size measures how much they wrote."
  - "Risks felt most outside North America and Europe: English Wikipedia's editors skew towards them, so labelling work, data-centre siting and surveillance in other legal systems can be thin or absent."
  - "Anything after the pin: the pin is one day's text, and articles on fast-moving subjects are rewritten often."
  - "Which articles are about risk: category membership mixes risks with the organisations, books and fiction about them, and some relevant articles are in no seed category."
  - "That an absent risk is unimportant: silence is not absence."
