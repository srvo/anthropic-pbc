        description: "Questions in the stratum across all AI questions."
      "symbol":
        type: string
        description: "Ticker."
      "report_date":
        type: string
        unit: YYYY-MM-DD
        description: "Call report date."
      "speaker":
        type: string
        description: "Speaker string as in the source."
        verbatim: true
      "text":
