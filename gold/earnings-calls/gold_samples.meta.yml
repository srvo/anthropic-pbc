      "q_harm": {type: string, description: "Human y/n label for q_harm; empty until coded."}
      "q_security": {type: string, description: "Human y/n label for q_security; empty until coded."}
      "coder":
        type: string
        description: "Name typed by the person who coded the row; empty until coded."
      "note":
        type: string
        description: "Coder's optional note, whitespace collapsed."
