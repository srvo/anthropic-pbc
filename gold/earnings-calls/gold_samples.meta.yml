          oversight_one: "One witness, not both, >= 0.5 on an oversight hypothesis."
          commercial_only: "Both witnesses >= 0.5 on a commercial hypothesis, and not in an oversight stratum."
          neither: "Everything else."
      "stratum_population":
        type: integer
