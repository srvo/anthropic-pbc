<title id="t">T0: does not stand</title>
<desc id="d">Premise T0 of the Anthropic PBC working paper. Anthropic is a public benefit corporation in law, and not in the sense the category promises: no one it names can make it act like one. It does not stand; no quotation under it; because-ness 1.</desc>
